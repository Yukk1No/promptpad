name: promptpad
description: Auto-following teleprompter with real-time speech recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.0
  wakelock_plus: ^1.2.0
  screen_brightness: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
