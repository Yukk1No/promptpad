name: promptpad
description: Auto-following teleprompter with real-time speech recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.0
  wakelock_plus: ^1.2.0
  screen_brightness: ^2.0.0
  url_launcher: ^6.2.0
  package_info_plus: ^8.0.0
  # Debug-mode calibration log export (settings → Debug → Export
  # calibration log). path_provider for the temp file, share_plus
  # to invoke the system share sheet so testers without Xcode / adb
  # can ship the log out of the device. See lib/services/debug_log.dart.
  path_provider: ^2.1.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
