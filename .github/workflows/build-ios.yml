name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned .app via xcodebuild
        run: |
          # Let Flutter generate the Xcode project
          flutter build ios --release --no-codesign --config-only

          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/ios/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package as IPA
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/Runner.xcarchive/Products/Applications/Runner.app build/ios/Payload/
          cd build/ios && zip -r PromptPad-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: promptpad-unsigned-ipa
          path: build/ios/PromptPad-unsigned.ipa
