name: Build iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the build (requires secrets)'
        type: boolean
        default: false

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # === Unsigned build (default) ===
      # Produces .app bundle you can sign on-device via AltStore / Sideloadly
      - name: Build unsigned .app
        if: ${{ !inputs.sign }}
        run: |
          flutter build ios --release --no-codesign
          # Package .app into a .ipa shell for sideloading
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -r PromptPad-unsigned.ipa Payload/

      - name: Upload unsigned IPA
        if: ${{ !inputs.sign }}
        uses: actions/upload-artifact@v4
        with:
          name: promptpad-unsigned-ipa
          path: build/ios/PromptPad-unsigned.ipa

      # === Signed build (opt-in) ===
      - name: Install Apple certificate
        if: ${{ inputs.sign }}
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$P12_BASE64" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        if: ${{ inputs.sign }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload signed IPA
        if: ${{ inputs.sign }}
        uses: actions/upload-artifact@v4
        with:
          name: promptpad-signed-ipa
          path: build/ios/ipa/*.ipa

      - name: Clean up keychain
        if: ${{ inputs.sign && always() }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
